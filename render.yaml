services:
  - type: web
    name: hmb-surf-bot
    runtime: python
    plan: free          # passe à starter pour supprimer la mise en veille
    buildCommand: pip install -r requirements.txt && python download_voices.py
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: KEEPALIVE_ENABLED
        value: "1"
      - key: WEBHOOK_WATCHDOG_SECONDS
        value: "600"
